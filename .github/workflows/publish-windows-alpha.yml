name: Publish verified Windows alpha

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful CI run that contains ScriptCut-windows-x64
        required: true
        type: string
      release_tag:
        description: Optional GitHub prerelease tag (defaults to windows-alpha-v<package version>)
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Promote verified Windows artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out verified source
        uses: actions/checkout@v7

      - name: Resolve release version and tag
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(jq -r '.version' package.json)"
          [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          release_tag="${INPUT_RELEASE_TAG:-windows-alpha-v$app_version}"
          [[ "$release_tag" =~ ^[A-Za-z0-9._-]+$ ]]
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Download artifacts from the verified run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          mkdir -p artifacts
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name ScriptCut-windows-x64 \
            --dir artifacts

      - name: Validate release payload
        shell: bash
        run: |
          set -euo pipefail
          test -f "artifacts/ScriptCut Setup $APP_VERSION.exe"
          test -f "artifacts/ScriptCut $APP_VERSION.exe"
          test -f "artifacts/release-windows/SHA256SUMS.txt"
          test -f "artifacts/release-windows/release-manifest.json"
          (
            cd artifacts
            sha256sum --check release-windows/SHA256SUMS.txt
          )

      - name: Prepare public asset names and checksums
        shell: bash
        run: |
          set -euo pipefail
          mv "artifacts/ScriptCut Setup $APP_VERSION.exe" \
            "artifacts/ScriptCut-Setup-$APP_VERSION-x64.exe"
          mv "artifacts/ScriptCut $APP_VERSION.exe" \
            "artifacts/ScriptCut-$APP_VERSION-portable-x64.exe"

          jq --arg version "$APP_VERSION" '
            .artifacts |= map(
              if .file == ("ScriptCut Setup " + $version + ".exe") then
                .file = ("ScriptCut-Setup-" + $version + "-x64.exe")
              elif .file == ("ScriptCut " + $version + ".exe") then
                .file = ("ScriptCut-" + $version + "-portable-x64.exe")
              else
                .
              end
            )
          ' artifacts/release-windows/release-manifest.json \
            > artifacts/release-manifest-windows-x64.json

          (
            cd artifacts
            sha256sum \
              "ScriptCut-Setup-$APP_VERSION-x64.exe" \
              "ScriptCut-$APP_VERSION-portable-x64.exe" \
              > SHA256SUMS-windows-x64.txt
          )

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Native Windows 10/11 x64 alpha for ScriptCut.

          - \`ScriptCut-Setup-$APP_VERSION-x64.exe\`: assisted NSIS installer.
          - \`ScriptCut-$APP_VERSION-portable-x64.exe\`: portable build.
          - Python, Node.js, and a separate FFmpeg installation are not required.
          - The build is unsigned, so Windows SmartScreen may show a warning.
          - Faster Whisper safely falls back from unsupported float16 GPUs to CPU.
          - Long-stream waveforms are generated with bounded memory through FFmpeg.

          This payload was promoted only after native Windows CI started the
          packaged backend, rendered a vertical MP4 with ASS captions and a
          censorship bleep, probed it with bundled FFprobe, and launched the
          packaged ScriptCut.exe.
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "ScriptCut $APP_VERSION Windows alpha" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "ScriptCut $APP_VERSION Windows alpha" \
              --notes-file release-notes.md
          fi

          for old_asset in \
            "ScriptCut.$APP_VERSION.exe" \
            "ScriptCut.Setup.$APP_VERSION.exe" \
            "SHA256SUMS.txt" \
            "release-manifest.json"; do
            gh release delete-asset "$RELEASE_TAG" "$old_asset" \
              --repo "$GITHUB_REPOSITORY" \
              --yes 2>/dev/null || true
          done

          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "artifacts/ScriptCut-Setup-$APP_VERSION-x64.exe" \
            "artifacts/ScriptCut-$APP_VERSION-portable-x64.exe" \
            "artifacts/SHA256SUMS-windows-x64.txt" \
            "artifacts/release-manifest-windows-x64.json"
